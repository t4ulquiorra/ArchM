name: Release ArchM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleGmsMobileUniversalRelease

      - name: Prepare APK for Signing
        id: prepare_apk
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/release"
          mkdir -p "$RELEASE_DIR"
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found after build"
            exit 1
          fi
          echo "Found APK at $APK_FILE"
          cp "$APK_FILE" "$RELEASE_DIR/app-release-unsigned.apk"
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign Release APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.prepare_apk.outputs.release_dir }}/
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename Signed APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.prepare_apk.outputs.release_dir }}"
          SIGNED_APK=$(find "$RELEASE_DIR" -type f \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            mv "$SIGNED_APK" "$RELEASE_DIR/ArchM-release.apk"
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchM-Release-APK
          path: ${{ steps.prepare_apk.outputs.release_dir }}/ArchM-release.apk
